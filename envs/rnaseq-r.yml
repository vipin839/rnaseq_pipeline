# R / Bioconductor environment for DESeq2 and downstream analysis.
# Create with:  mamba env create -f envs/rnaseq-r.yml
name: rnaseq-r
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base>=4.3
  - bioconductor-deseq2
  - bioconductor-enhancedvolcano
  - bioconductor-apeglm
  - r-ggplot2
  - r-ggrepel
  - r-pheatmap
  - r-rcolorbrewer
  - r-data.table
  - r-dplyr
  - r-tibble
  - r-readr
  - r-jsonlite
