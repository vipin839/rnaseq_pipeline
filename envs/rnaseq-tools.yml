# Pre-DESeq2 command-line tools (Python-orchestrated stages).
# Create with:  mamba env create -f envs/rnaseq-tools.yml
name: rnaseq-tools
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pyyaml
  - pytest
  - fastqc>=0.12
  - multiqc>=1.21
  - fastp>=0.23
  - hisat2>=2.2.1
  - samtools>=1.17
  - stringtie>=2.2
  - subread>=2.0.3
  - sra-tools>=3.0
  - rseqc>=5.0
  - pigz
