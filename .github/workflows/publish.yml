name: Publish to PyPI

# Uploads the sdist and wheel attached to a GitHub release to PyPI, with PyPI Trusted Publishing (OIDC):
# no API token is stored anywhere. PyPI trusts exactly this workflow file in vipin839/rnaseq_pipeline,
# running in the "pypi" environment, for the project "bulk-rnaseq-pipeline".

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.1.2)"
        required: true

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/bulk-rnaseq-pipeline/
    permissions:
      contents: read
      id-token: write          # required for Trusted Publishing
    steps:
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
          ls -l dist
          version="${TAG#v}"
          test -f "dist/bulk_rnaseq_pipeline-${version}-py3-none-any.whl"
          test -f "dist/bulk_rnaseq_pipeline-${version}.tar.gz"
          test "$(ls dist | wc -l)" -eq 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the files
        run: |
          python -m pip install --quiet twine
          twine check --strict dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
