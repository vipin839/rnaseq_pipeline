threads: auto
max_memory_gb: auto
environment:
  conda_root: ~/miniforge3
  tools_env: rnaseq-tools
  r_env: rnaseq-r
  use_path_fallback: true
read_type: auto
import_mode: symlink
download:
  source_preference: ena
  max_reads: 0
  retries: 3
fastq_validation:
  workers: auto
  allowed_bases: ACGTNacgtn.
  quality_offset: 33
quality_gate:
  adapter_max_percent_trim: 5.0
  adapter_max_percent_review: 1.0
  tail_mean_quality_trim: 20
  tail_mean_quality_review: 28
  per_base_lower_quartile_min: 10
  overrepresented_max_percent: 1.0
  n_content_max_percent: 5.0
  duplication_review_percent: 80.0
  gc_deviation_review: 10.0
  min_reads_review: 1000000
trim_adapters: ask
fastp_parameters:
  detect_adapter_for_pe: true
  qualified_quality_phred: 20
  unqualified_percent_limit: 40
  cut_right: true
  cut_right_window_size: 4
  cut_right_mean_quality: 20
  length_required: 25
  extra_args: []
reference_source: ask
organism: ask
genome_assembly: ask
annotation_release: ask
reference_store: /tmp/pytest-of-superbear/pytest-8/work0/refstore
hisat2_build:
  use_splice_sites_in_index: auto
  extra_args: []
hisat2_parameters:
  dta: true
  use_known_splice_sites: true
  no_mixed: false
  no_discordant: false
  extra_args: []
samtools_sort_memory_per_thread: auto
min_overall_alignment_rate_warn: 70.0
min_overall_alignment_rate_fail: 20.0
strandedness: auto
strandedness_inference:
  sample_reads: 200000
  stranded_min_fraction: 0.8
  unstranded_max_diff: 0.1
  max_undetermined_fraction: 0.5
stringtie_parameters:
  enabled: true
  reference_guided_only: true
  ballgown_tables: false
  extra_args: []
featurecounts_parameters:
  feature_type: exon
  attribute: gene_id
  count_multimapping: false
  fractional: false
  primary_only: false
  min_mapping_quality: 0
  require_both_ends_mapped: true
  count_chimeric: false
  extra_args: []
design_formula: ~ condition
reference_level: ask
alpha: 0.05
log2fc_threshold: 1.0
lfc_test_threshold: 0
min_count_filter:
  min_count: 10
  min_samples: smallest_group
independent_filtering: true
cooks_cutoff: true
lfc_shrinkage: apeglm
top_n_genes: 50
heatmap_max_genes: 500
transformation: vst
plot_formats:
- png
- pdf
plot_dpi: 300
annotation:
  enabled: false
  go: false
  reactome: false
storage:
  min_free_gb_warn: 50
  borderline_factor: 1.5
  cleanup_intermediates: ask
verbose: false
